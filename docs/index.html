<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f5784">
<title>오픈니스 스튜디오 2026 하반기 채용 현황</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mac.css">
</head>
<body class="locked">
<a class="skip" href="#app">본문으로 건너뛰기</a>
<!-- 비밀번호 입력 화면: 맥북 잠금 화면 스타일. 배경 사진은 assets/lock.jpg (배포본 index.html 에만 삽입된다) -->
<section class="gate" id="gate" aria-label="비밀번호 입력">

  <div class="lock-clock" aria-hidden="true">
    <p class="lock-date" id="lockDate"></p>
    <p class="lock-time" id="lockTime"></p>
  </div>

  <form class="lock-user" id="gateForm" autocomplete="off">
    <svg class="lock-avatar" viewBox="0 0 72 72" width="68" height="68" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="lgMark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#667648"/><stop offset="1" stop-color="#4b5b34"/></linearGradient>
        <!-- 링: 오른쪽 위(해 쪽)는 따뜻하게 밝고, 왼쪽 아래로 갈수록 옅어진다 -->
        <linearGradient id="lgRim" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".55" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff4cf" stop-opacity=".92"/></linearGradient>
        <!-- 원 안쪽에 번지는 햇빛 -->
        <radialGradient id="lgLit" cx="58" cy="13" r="38" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff0bd" stop-opacity=".34"/><stop offset=".25" stop-color="#ffeab0" stop-opacity=".2"/><stop offset=".55" stop-color="#ffe7a8" stop-opacity=".07"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/></radialGradient>
        <!-- 원 바깥으로 살짝 번지는 빛 -->
        <radialGradient id="lgFlare" cx="58" cy="14" r="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff3cc" stop-opacity=".5"/><stop offset=".2" stop-color="#ffe6a8" stop-opacity=".3"/><stop offset=".45" stop-color="#ffdc94" stop-opacity=".13"/><stop offset=".72" stop-color="#ffdc94" stop-opacity=".04"/><stop offset="1" stop-color="#ffdc94" stop-opacity="0"/></radialGradient>
      </defs>
      <circle cx="36" cy="36" r="34.5" fill="url(#lgMark)"/>
      <circle cx="36" cy="36" r="34.5" fill="url(#lgLit)"/>
      <circle cx="36" cy="36" r="33.75" fill="none" stroke="url(#lgRim)" stroke-width="1.5"/>
      <g fill="#fff" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="2.5">
        <text x="37.2" y="33">OP</text>
        <text x="37.2" y="56">NS</text>
      </g>
      <circle cx="58" cy="14" r="34" fill="url(#lgFlare)"/>
      <path d="M59 8.5Q59.4 12.6 63.5 13Q59.4 13.4 59 17.5Q58.6 13.4 54.5 13Q58.6 12.6 59 8.5Z" fill="#fffaf0" fill-opacity=".6"/>
    </svg>
    <h1>오픈니스 스튜디오</h1>
    <div class="lock-field" id="gateField">
      <input id="gatePw" type="password" inputmode="numeric" enterkeyhint="go" autocomplete="off" placeholder="비밀번호 입력" aria-label="비밀번호">
      <button type="submit" id="gateBtn" aria-label="입장" title="입장">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M3 8h9M8.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="lock-sub">2026 하반기 채용 · 인사팀 → 실무팀 공유용</p>
    <p class="gate-msg" id="gateMsg" role="alert" aria-live="polite"></p>
  </form>
</section>

<header class="top">
  <div class="bar">
    <a class="brand" href="#/" aria-label="현황으로 이동">
      <img src="assets/logo.png" alt="" width="34" height="34">
      <span>OPENNESS STUDIO<small>2026 H2 RECRUIT</small></span>
    </a>
    <nav id="nav" aria-label="주 메뉴"></nav>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <p>오픈니스 스튜디오 2026 하반기 채용 · 인사팀 → 실무팀 공유용 자료입니다. 지원자 정보 보호를 위해 외부 전달을 삼가 주세요.</p>
</footer>





<script src="js/mac.js"></script>
<script src="payload.js"></script>
<script src="js/gate.js"></script>
</body>
</html>
