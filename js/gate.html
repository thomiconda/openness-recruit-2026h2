<!-- 비밀번호 입력 화면 (배포본 index.html 에만 삽입된다) -->
<section class="gate" id="gate" aria-label="비밀번호 입력">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <img src="assets/logo.png" alt="" width="56" height="56">
    <h1>오픈니스 스튜디오<small>2026 하반기 채용 · 인사팀 → 실무팀 공유용</small></h1>
    <p>비밀번호를 입력해 주세요.</p>
    <input id="gatePw" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호" aria-label="비밀번호" required>
    <button type="submit" id="gateBtn">입장</button>
    <p class="gate-msg" id="gateMsg" role="alert" aria-live="polite"></p>
  </form>
</section>
